server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: repopilot-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/repopilot}
    username: ${SPRING_DATASOURCE_USERNAME:repopilot_user}
    password: ${SPRING_DATASOURCE_PASSWORD:repopilot_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      timeout: 2000ms

# Actuator Health Metrics
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0

# Custom Security & External Config
repopilot:
  telemetry:
    tracing:
      sampling-probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  jwt:
    secret: ${JWT_SECRET:super_secret_jwt_key_repopilot_must_be_at_least_256_bits_long_for_security_12345}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}
  github:
    client-id: ${GITHUB_CLIENT_ID:placeholder}
    client-secret: ${GITHUB_CLIENT_SECRET:placeholder}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:3000/api/auth/callback/github}
    encryption-key: ${GITHUB_ENCRYPTION_KEY:DefaultRepoPilotGitHubTokenEncryptionKey32BytesLong!}
  indexing:
    max-files-per-repo: ${INDEXING_MAX_FILES_PER_REPO:1000}
    max-file-size-bytes: ${INDEXING_MAX_FILE_SIZE_BYTES:1048576}
    max-lines-per-file: ${INDEXING_MAX_LINES_PER_FILE:10000}
    batch-size: ${INDEXING_BATCH_SIZE:32}
    max-chunk-tokens: ${INDEXING_MAX_CHUNK_TOKENS:2000}
    max-chunk-chars: ${INDEXING_MAX_CHUNK_CHARS:6000}
